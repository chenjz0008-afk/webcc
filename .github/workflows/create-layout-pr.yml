name: Create layout pull request
on:
  push:
    branches: [refactor/project-layout]
    paths: [.github/workflows/create-layout-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Changes
          - Group backend modules, requirements and configuration templates in dedicated directories.
          - Keep four primary documents at the repository root; preserve maintained tests and synthetic fixtures.
          - Update installation paths, frontend build output and concise API documentation.

          ## Verification
          - Clean server checkout regression suite, frontend build and account display checks.
          - Runtime file contents match the deployed d60e894 release; ClewdR is unchanged.
          - The complete 96-task business matrix remains pending.
          EOF
          if ! gh pr create --base main --head refactor/project-layout --title 'Organize project directories and refresh release documentation' --body-file /tmp/pr-body.md 2>/tmp/pr-error; then
            if grep -q 'GitHub Actions is not permitted' /tmp/pr-error; then
              echo '::error::Repository policy denies GitHub Actions pull request creation'
            elif grep -q 'Resource not accessible' /tmp/pr-error; then
              echo '::error::GitHub token cannot access pull request creation'
            elif grep -q 'already exists' /tmp/pr-error; then
              echo '::notice::Pull request already exists'
              exit 0
            else
              echo '::error::Pull request creation failed; inspect the GitHub job log'
            fi
            exit 1
          fi
