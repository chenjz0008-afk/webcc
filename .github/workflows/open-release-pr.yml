name: Open production snapshot PR
on:
  push:
    branches: [fix/production-static-sync]
    paths: [.github/workflows/open-release-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo chenjz0008-afk/webcc --head fix/production-static-sync --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            printf '%s\n' "$existing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/webcc-pr-body.md <<'BODY'
          ## 变更
          同步线上 index.html 及新增前端构建资源，保留旧缓存资源。记录 GitHub 与线上源码、静态产物 SHA256 校验。运行代码、官方 ClewdR、服务器配置和账号数据没有改动。
          ## 验证
          main 已合并 PR #5；11 个后端源码文件与线上一致。本次同步后 61 个公开前端文件 SHA256 与线上完全一致。管理服务、Nginx 与出口保护服务均 active。线上版本此前已通过 142 项回归、11 次候选模型请求与公网工具/PDF 测试。
          ## 范围
          本次仅补齐仓库发布快照，不重新部署、不包含账号或凭据。详见 docs/production-sync-2026-10-07.json 和 docs/PRODUCTION-RELEASE.md。临时创建 PR 工作流执行后删除，不合并。
          BODY
          set +e
          gh pr create --repo chenjz0008-afk/webcc --base main --head fix/production-static-sync --title '同步线上前端构建产物与校验记录' --body-file /tmp/webcc-pr-body.md > /tmp/webcc-pr-result.txt 2>&1
          result=$?
          cat /tmp/webcc-pr-result.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < /tmp/webcc-pr-result.txt
          fi
          exit "$result"
