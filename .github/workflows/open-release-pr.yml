name: Open web capability PR
on:
  push:
    branches: [feat/web-tool-history]
    paths: [.github/workflows/open-release-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo chenjz0008-afk/webcc --head feat/web-tool-history --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            printf '%s\n' "$existing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > /tmp/webcc-pr-body.md <<'BODY'
          ## 变更
          网页实验工具支持 strict 布尔字段和本地 JSON Schema 校验，响应明确标记 no-native-strict。普通 Messages 的内联 PDF document 输入映射到 ClewdR 已有上传路径，保留文件字节、标题和上下文；非法来源、原生引用及不支持扩展在选号前拒绝。官方 ClewdR 保持原样。
          ## 验证
          服务器隔离环境 142 项回归通过（77.280 秒）。ccb9 的 11 次真实模型请求通过，涵盖七种工具选择、本地 strict、PNG 和两种 PDF 输入。HTTPS、密钥隔离和撤销、错误 ID 拒绝、槽位及临时资源清理通过。保留修改前 PDF 失败记录。
          ## 范围
          原生 strict、Thinking 签名、Files、缓存和服务端工具仍未完成。支持范围和剩余计划见 docs/WEB-ACCOUNT-CAPABILITIES.md、TODO.md 和 CHANGELOG.md。生产发布按用户单独授权执行，本工作流不合并代码、不部署。
          BODY
          set +e
          gh pr create --repo chenjz0008-afk/webcc --base main --head feat/web-tool-history --title '网页工具参数校验与 PDF 输入兼容' --body-file /tmp/webcc-pr-body.md > /tmp/webcc-pr-result.txt 2>&1
          result=$?
          cat /tmp/webcc-pr-result.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < /tmp/webcc-pr-result.txt
          fi
          exit "$result"
