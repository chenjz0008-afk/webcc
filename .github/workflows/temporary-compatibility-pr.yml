name: Open compatibility pull request
on:
  push:
    branches: [feat/claude-code-compatibility]
    paths: [.github/workflows/temporary-compatibility-pr.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ['REPOSITORY']
          head = repo.split('/')[0] + ':feat/claude-code-compatibility'
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          pulls = api('/pulls?' + urllib.parse.urlencode({'state': 'open', 'head': head}))
          result = pulls[0] if pulls else api('/pulls', {
              'title': 'Improve Claude Code tool continuity and resource availability',
              'head': 'feat/claude-code-compatibility', 'base': 'main',
              'body': '## Changes\n\nPreserve progress before tool calls; stop replay after partial delivery; skip known unavailable worker sessions. Keep ClewdR unmodified. Includes the previously deployed compatibility fixes.\n\n## Validation\n\n361 server regression tests and 18 focused resource tests passed. Real Claude Code auto/bypass editing, search, cancellation and recovery passed. Five long-history and concurrency cases completed 85 model rounds. Earlier failures are retained privately.\n\nTemporary PR workflow will be removed after creation. This pull request does not merge automatically.'})
          print(result['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Pull request: ' + result['html_url'] + '\n')
          PY
